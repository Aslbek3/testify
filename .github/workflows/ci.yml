# Uzluksiz integratsiya — har push va pull request'da.
#
# Nega faqat shular: bu yerdagi hamma narsa baza ham, server ham talab
# qilmaydi (sof funksiyalar), ya'ni sekundlarda tugaydi va har safar
# ishlaydi. Bazaga boradigan ikki to'plam ataylab tashqarida:
# `npm run test:services` (`tests/services/`, `.env` dagi
# `DATABASE_URL` kerak) va `scripts/tekshiruv-ui.ts` (110 ta HTTP
# tekshiruv, ishlab turgan dev server kerak). Ularni aralashtirsak, CI
# sekin va ishonchsiz bo'lib qolardi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tekshiruv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` postinstall orqali `prisma generate` ni ham ishga
      # tushiradi — tiplar usiz tayyor bo'lmaydi. Bazaga ULANMAYDI.
      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Lint
        run: npx eslint src scripts tests

      - name: Birlik testlari
        run: npm test

      # Qamrov — faqat KO'RSATADI, yiqitmaydi. Chegara (`--test-coverage-lines`)
      # ataylab qo'yilmagan: qamrov hali past va qattiq chegara CI'ni doimiy
      # qizil holatda ushlab turardi, ya'ni signal qiymatini yo'qotardi.
      # `continue-on-error` esa `--experimental-test-coverage` bayrog'i uchun:
      # u tajriba bosqichida va Node yangilanishida xatti-harakati o'zgarishi
      # mumkin — qamrov hisoboti hech qachon haqiqiy testlarni bloklamasin.
      #
      # ⚠️ Bu son BAZASIZ ishlaydigan testlar bo'yicha. Servis qatlamining
      # qamrovi `npm run test:coverage:all` da (baza kerak) — u CI'da yo'q.
      - name: Qamrov (ma'lumot uchun)
        run: npm run test:coverage
        continue-on-error: true

      # Next.js marshrut tiplari (`.next/types`) — usiz `tsc` sahifa
      # propslarini topa olmaydi (`muhim.md` dagi eslatma).
      - name: Marshrut tiplarini generatsiya qilish
        run: npx next typegen

      - name: TypeScript
        run: npm run typecheck
